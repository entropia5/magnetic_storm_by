<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Telegram weather screen preview</title>
  <desc id="desc">Sanitized Telegram user-view preview of the weather screen.</desc>
  <defs>
    <linearGradient id="chatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1418"/>
      <stop offset="1" stop-color="#17201f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="900" height="620" rx="26" fill="#0b0e10"/>
  <rect x="22" y="22" width="856" height="576" rx="22" fill="url(#chatBg)"/>
  <rect x="22" y="22" width="856" height="64" rx="22" fill="#202b34"/>
  <circle cx="62" cy="54" r="22" fill="#177348"/>
  <text x="62" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Kp</text>
  <text x="98" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f6f7f4">Geomagnetic Belarus Bot</text>
  <text x="98" y="72" font-family="Arial, sans-serif" font-size="14" fill="#8fb0a2">bot</text>

  <g transform="translate(58 116)" filter="url(#shadow)">
    <rect width="610" height="330" rx="16" fill="#1d2428"/>
    <rect width="610" height="34" rx="16" fill="#c91924"/>
    <rect x="378" width="46" height="34" fill="#f6f7f4"/>
    <rect x="424" width="186" height="34" rx="16" fill="#177348"/>
    <rect x="0" y="34" width="52" height="296" fill="#f6f7f4"/>
    <rect x="52" y="34" width="5" height="296" fill="#177348"/>
    <text x="82" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f6f7f4">Погода сейчас</text>
    <text x="82" y="128" font-family="Arial, sans-serif" font-size="20" fill="#cfd6d2">Сохранённый город: Копыль</text>
    <rect x="82" y="154" width="454" height="144" rx="10" fill="#202426" stroke="#3d474a"/>
    <text x="108" y="206" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#f6f7f4">Копыль</text>
    <text x="108" y="242" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d7ded9">пасмурно</text>
    <text x="420" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="74" font-weight="900" fill="#f6f7f4">12°</text>
    <text x="108" y="276" font-family="Arial, sans-serif" font-size="18" fill="#d7ded9">Ощущается 11°C · влажность 78% · ветер 4 м/с</text>
  </g>

  <g transform="translate(58 464)">
    <rect width="610" height="72" rx="14" fill="#222f37"/>
    <text x="22" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f6f7f4">Погода берётся по сохранённому городу.</text>
    <text x="22" y="56" font-family="Arial, sans-serif" font-size="15" fill="#d8dfda">Если город не найден, бот просит ввести корректное название населённого пункта Беларуси.</text>
  </g>

  <g transform="translate(690 452)">
    <rect width="150" height="36" rx="10" fill="#2c4252"/>
    <text x="75" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d9f0ff">Текущий индекс</text>
    <rect y="44" width="150" height="36" rx="10" fill="#2c4252"/>
    <text x="75" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d9f0ff">Изменить город</text>
    <rect y="88" width="150" height="36" rx="10" fill="#2c4252"/>
    <text x="75" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d9f0ff">Прогноз</text>
  </g>
  <text x="58" y="582" font-family="Arial, sans-serif" font-size="13" fill="#7f9198">Sanitized preview: no real chat ids, message ids, tokens, or user data.</text>
</svg>
