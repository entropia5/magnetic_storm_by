<svg width="980" height="720" viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Telegram morning report preview</title>
  <desc id="desc">Sanitized Telegram user-view preview of the current wide morning report.</desc>
  <defs>
    <linearGradient id="chatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1418"/>
      <stop offset="1" stop-color="#17211f"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111416"/>
      <stop offset="0.58" stop-color="#1d2224"/>
      <stop offset="1" stop-color="#131819"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="980" height="720" rx="26" fill="#0b0e10"/>
  <rect x="24" y="24" width="932" height="672" rx="22" fill="url(#chatBg)"/>
  <rect x="24" y="24" width="932" height="66" rx="22" fill="#202b34"/>
  <circle cx="66" cy="57" r="22" fill="#177348"/>
  <text x="66" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Kp</text>
  <text x="104" y="52" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f6f7f4">Geomagnetic Belarus Bot</text>
  <text x="104" y="75" font-family="Arial, sans-serif" font-size="14" fill="#8fb0a2">morning report preview</text>

  <g transform="translate(54 118)" filter="url(#shadow)">
    <rect width="872" height="410" rx="18" fill="url(#screenBg)"/>
    <rect width="872" height="26" rx="18" fill="#c91924"/>
    <rect x="541" width="66" height="26" fill="#f6f7f4"/>
    <rect x="607" width="265" height="26" rx="18" fill="#177348"/>

    <text x="24" y="76" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#f6f7f4">Доброе утро</text>
    <text x="24" y="110" font-family="Arial, sans-serif" font-size="24" fill="#cfd6d2">13 июня 2026, Суббота</text>

    <rect x="24" y="136" width="166" height="118" rx="8" fill="#22a86a"/>
    <text x="42" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#eaf8ef">Индекс Kp</text>
    <text x="42" y="220" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#fff">2.3</text>
    <text x="42" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#eaf8ef">Спокойное поле</text>

    <rect x="204" y="136" width="644" height="118" rx="8" fill="#202426" stroke="#3d474a"/>
    <rect x="204" y="136" width="7" height="118" rx="4" fill="#177348"/>
    <text x="230" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#f6f7f4">Сейчас геомагнитная обстановка спокойная.</text>
    <text x="230" y="220" font-family="Arial, sans-serif" font-size="22" fill="#d7ded9">Текущий индекс и прогноз дня уже внутри изображения.</text>

    <g transform="translate(24 278)">
      <rect width="824" height="104" rx="8" fill="#202426" stroke="#3d474a"/>
      <rect width="824" height="7" rx="4" fill="#c91924"/>
      <rect y="97" width="824" height="7" rx="4" fill="#177348"/>
      <text x="22" y="44" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#f6f7f4">Копыль</text>
      <text x="22" y="75" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#d7ded9">пасмурно · ощущается 7°C · ветер 4 м/с</text>
      <text x="716" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="900" fill="#f6f7f4">9°</text>
    </g>

    <text x="24" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#aeb8b2">Утренний отчёт · Копыль · страница 1 из 4</text>
  </g>

  <g transform="translate(54 548)">
    <rect width="872" height="54" rx="14" fill="#222f37"/>
    <text x="22" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#f6f7f4">Утренняя сводка на 13 июня 2026, Суббота.</text>
  </g>

  <g transform="translate(54 614)">
    <rect width="872" height="56" rx="14" fill="#202733"/>
    <text x="436" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#f6f7f4">Прогноз на 3 дня →</text>
  </g>

  <text x="54" y="694" font-family="Arial, sans-serif" font-size="13" fill="#7f9198">Sanitized preview: no real chat ids, message ids, tokens, or user data.</text>
</svg>
